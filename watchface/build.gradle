plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devlomi.watchface.watchface'
    compileSdk 34

    defaultConfig {
        applicationId "com.devlomi.prayerwatchface.v2"
        minSdk 33
        targetSdk 34
        versionCode 6
        versionName "1.0"

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

